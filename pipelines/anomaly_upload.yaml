# BETA. Watch a robot log for anomalies, ask Jev (TypeSafe) to label them, and send
# only the anomalous 10-second slices -- each with a JSON label -- to a bucket.
#
# Every 10 s the `anomaly` gate compares the last 10 s against a rolling baseline
# learned on the robot. When a signal shifts outside its normal spread, it asks Jev
# which of the named anomalies this is (or `other_unusual` / `normal`). Set
# `mode: always` to ask Jev about every window instead. If Jev is unreachable,
# flagged slices are still uploaded, labelled `screen_only`.
#
# Beta: recorded logs only. A `sensor_dropout`-style anomaly needs a watched topic
# other than the cadence topic (the pipeline only runs when that one publishes).
#
# Needs TYPESAFE_API_KEY in the environment (or `backend: remote` + `url`).
# Uploads work with any supported store: swap upload.s3 for upload.gcs / upload.azure,
# or set `endpoint_url` for MinIO / R2.
name: anomaly_upload
site: warehouse
asset: forklift
path: ./data/sample/ros2/mcap # <-- point this at a real recorded log (the sample is 0.6 s long)
allow_failure: false
cadence:
  topic: /fluid_pressure
  when:
    every: 10
    unit: second
gates:
  - module: src.pipeline.gates.anomaly
    lookback:
      last: 10
      unit: second
    args:
      topics: [/fluid_pressure]
      anomalies:
        pressure_spike: "fluid pressure far above or below normal"
      mode: screen # or: always
      z_threshold: 3.0
      dropout_seconds: 2
      baseline_window_minutes: 30
      warmup_minutes: 5
      min_probability: 0.6
      backend: jev # model defaults to jev-latest
      # Through Vercel AI Gateway instead of a TypeSafe key:
      # url: https://ai-gateway.vercel.sh/typesafe/v1/systemone
      # model: typesafe-ai/jev
      # api_key_env: AI_GATEWAY_API_KEY
tasks:
  - module: src.pipeline.tasks.snippet.mcap
    lookback:
      last: 10
      unit: second
  - module: src.pipeline.tasks.write_annotations
  - module: src.pipeline.tasks.upload.s3
    args:
      bucket: my-robot-anomalies # <-- your bucket
      prefix: anomalies
      # Artifact directory inside the Bagel images (settings.ARTIFACT_DIRECTORY).
      source: /home/ubuntu/.bagel/artifacts/pipeline=anomaly_upload
