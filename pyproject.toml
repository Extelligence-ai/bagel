[project]
name = "bagel"
version = "2.0.0"
description = "Bagel MCP Server"
authors = []
requires-python = ">=3.10,<3.13"
dependencies = [
    "boto3 >=1.40.0, <2.0.0",
    "duckdb >=1.3.0,<2.0.0",
    "filelock >=3.19.0,<4.0.0",
    "humanize >=4.14.0,<5.0.0",
    "Jinja2 >=3.1.0,<4.0.0",
    "lark >=1.2.0,<2.0.0",
    "mcap >=1.3.0,<2.0.0",
    "mcap-protobuf-support >=0.5.0,<1.0.0",
    "mcap-ros1-support >=0.7.0,<1.0.0",
    "mcap-ros2-support >=0.5.0,<1.0.0",
    # v2-ready via src/mcp_compat.py (verified against 2.0.0b1); raise the
    # ceiling once v2 stable (2026-07-28) is validated end to end.
    "mcp >=1.11.0,<2.0.0",
    "pandas >=2.2.0,<3.0.0",
    "poml >=0.0.7,<1.0.0",
    "protobuf >=6.31.0,<7.0.0",
    "pyarrow >=18.0.0,<19.0.0",
    "pydantic >=2.11.0,<3.0.0",
    "pydantic-settings >=2.9.0,<3.0.0",
    "PyYAML >=6.0.0,<7.0.0",
    "zstandard>=0.23.0,<1.0.0",
]

[dependency-groups]
dev = [
    "hypothesis >=6.100.0,<7.0.0",
    "ipykernel >=6.29.0,<7.0.0",
    "ipython >=8.0.0,<9.0.0",
    "jupyterlab >=4.4.0,<5.0.0",
    "matplotlib >=3.10.0,<4.0.0",
    "pre-commit >=4.2.0,<5.0.0",
    "pytest >=8.4.0,<9.0.0",
    "pytest-cov >=5.0.0,<7.0.0",
    "ruff ==0.12.4",
]
cv = [
    "opencv-python >=4.0.0,<5.0.0",
    "pillow >=11.3.0,<12.0.0",
    "torch >=2.8.0,<3.0.0",
    "transformers >=4.57.0,<5.0.0",
]
ros1 = [
    "numpy <2.0.0",
    "pycryptodomex >=3.23.0,<4.0.0",
    "python-gnupg >=0.5.0,<1.0.0",
    "roslibpy >=1.8.1,<2.0.0",
    "rospkg >=1.6.0,<2.0.0",
]
ros2 = [
    "roslibpy >=1.8.1,<2.0.0",
]
px4 = ["pyulog >=1.2.0,<2.0.0", "GitPython >=3.1.0,<4.0.0"]
ardupilot = ["pymavlink >=2.4.0,<3.0.0"]
betaflight = ["orangebox >=0.4.0,<1.0.0"]
cloudini = ["wasmtime >=26.0.0", "numpy >=1.24.0,<3.0.0"]
iot = [
    "influxdb3-python>=0.10.0",
    "paho-mqtt>=2.1.0,<3.0.0",
]
upload = [
    "azure-storage-blob>=12.24.0,<13.0.0",
    "google-cloud-storage>=2.18.0,<4.0.0",
]
viz = [
    "rerun-sdk>=0.23.1",
]
automotive = [
    "asammdf>=7.4,<8",
    "cantools>=42.0.3",
    "python-can>=4.6.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "adversarial: malformed/fuzzed inputs and property-based tests",
    "e2e: end-to-end flows driving the real server against fixtures",
]

[tool.ruff]
line-length = 100
extend-exclude = ["src/sink/sparkplug/sparkplug_b_minimal_pb2.py"]  # generated code

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C90", # mccabe (cyclomatic complexity)
    "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PL",  # pylint
    "RUF", # Ruff-specific rules
    "S",   # flake8-bandit
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings

]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "PLC0415", # pylint (non top-level imports)
]
exclude = ["**/*.ipynb", "src/pipeline/tasks/cloudini/vendor/**"]

[tool.ruff.lint.per-file-ignores]
"./test/**/*.py" = ["S101", "S608", "D", "PLR2004"]  # S608: tests build SQL over their own tmp paths

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*", "*_pb2.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.paths]
source = ["src", "/home/ubuntu/runtime/src"]
