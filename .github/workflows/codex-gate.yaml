name: codex-gate

# Codex review is mandatory: this check passes only once the Codex cloud
# reviewer OR Claude (claude-review.yaml) has reviewed the PR's *current head
# commit*. When neither has, the job posts the "@codex review" trigger (once
# per commit) and fails; either reviewer submitting its review re-runs the
# gate via pull_request_review.
#
# Note: the auto-trigger comment is posted by github-actions[bot]; if the
# Codex app ignores bot-authored triggers, comment "@codex review" manually
# and the gate turns green when the review lands.
#
# Claude's reviews are posted by a deterministic, non-model shell step in
# claude-review.yaml (see that file's header) authenticated with the
# workflow's own GITHUB_TOKEN, so they're authored by github-actions[bot],
# not claude[bot] -- the model itself is given no posting capability at all,
# because any tool that lets it publish something is exploitable by a
# prompt-injected PR (see PR #235 review discussion). Trust here rests on
# claude-review.yaml's own controls -- its comment trigger is restricted to
# OWNER/MEMBER/COLLABORATOR, and its posting step independently validates
# the "Reviewed commit: <sha>" stamp against the real head commit before
# ever calling `gh pr review` -- not on the github-actions[bot] login by
# itself; `claude[bot]` stays in the accepted-logins list below too, in case
# a future revision restores direct App-token posting.
#
# GitHub suppresses new workflow runs for events created with a repo's
# GITHUB_TOKEN, so a github-actions[bot]-authored review from claude-review.yaml
# does NOT fire pull_request_review and won't auto-retrigger this gate --
# same caveat as the auto-trigger comment above: comment "@codex review" (or
# push a new commit) to re-run the gate once the review has landed.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  issues: write

jobs:
  codex-review-gate:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a Codex review of the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          reviewed_shas() {
            {
              gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                --jq '.[] | select(.user.login == "chatgpt-codex-connector[bot]" or .user.login == "claude[bot]" or .user.login == "github-actions[bot]") | .body' || true
              gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq '.[] | select(.user.login == "chatgpt-codex-connector[bot]") | .body' || true
            } | grep -oE 'Reviewed commit:[^a-f0-9]*[a-f0-9]{7,40}' \
              | grep -oE '[a-f0-9]{7,40}$' || true
          }
          for sha in $(reviewed_shas); do
            case "$HEAD_SHA" in
              "$sha"*)
                echo "An AI reviewer (Codex or Claude) reviewed the head commit ($sha)."
                exit 0
                ;;
            esac
          done
          marker="<!-- codex-gate:$HEAD_SHA -->"
          if gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' \
               | grep -qF "$marker"; then
            echo "Codex review already requested for $HEAD_SHA; waiting for it to land."
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" \
              -f body="$(printf '@codex review\n\n%s' "$marker")" >/dev/null
            echo "Requested a Codex review of $HEAD_SHA."
          fi
          echo "::error::Codex has not yet reviewed head commit $HEAD_SHA. The gate re-runs when its review is submitted."
          exit 1
