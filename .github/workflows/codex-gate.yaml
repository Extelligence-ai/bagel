name: codex-gate

# Codex review is mandatory: this check passes only once the Codex cloud
# reviewer OR Claude (claude-review.yaml) has reviewed the PR's *current head
# commit*. When neither has, the job posts the "@codex review" trigger (once
# per commit) and fails; either reviewer submitting its review re-runs the
# gate via pull_request_review.
#
# Note: the auto-trigger comment is posted by github-actions[bot]; if the
# Codex app ignores bot-authored triggers, comment "@codex review" manually
# and the gate turns green when the review lands.
#
# Claude's reviews are posted by a deterministic, non-model shell step in
# claude-review.yaml (see that file's header) -- the model itself is given
# no posting capability at all, because any tool that lets it publish
# something is exploitable by a prompt-injected PR (see PR #235 review
# discussion). That step authenticates with the CODEX_TRIGGER_TOKEN secret
# (the same maintainer-owned fine-grained PAT codex-rerequest.yaml uses), so
# the review is authored under that maintainer's own GitHub login
# (arunvenkatadri) -- a human identity no same-repo workflow can mint for
# itself, unlike github-actions[bot], which any workflow (including one
# added by a PR) could stamp with a forged "Reviewed commit: <sha>" body to
# satisfy its own gate. That's why github-actions[bot] is NOT in the
# accepted logins below, even though claude-review.yaml's posting step can
# fall back to it when the secret is unset (fail-open on posting the
# finding, fail-closed on this gate ever trusting it). `claude[bot]` stays
# in the list too, in case a future revision restores direct App-token
# posting.
#
# PAT-authored events aren't subject to GITHUB_TOKEN's workflow-run
# suppression, so an arunvenkatadri-authored review fires pull_request_review
# normally and this gate re-runs on its own -- no manual recomment needed.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  issues: write

jobs:
  codex-review-gate:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a Codex review of the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          reviewed_shas() {
            {
              gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                --jq '.[] | select(.user.login == "chatgpt-codex-connector[bot]" or .user.login == "claude[bot]" or .user.login == "arunvenkatadri") | .body' || true
              gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq '.[] | select(.user.login == "chatgpt-codex-connector[bot]") | .body' || true
            } | grep -oE 'Reviewed commit:[^a-f0-9]*[a-f0-9]{7,40}' \
              | grep -oE '[a-f0-9]{7,40}$' || true
          }
          for sha in $(reviewed_shas); do
            case "$HEAD_SHA" in
              "$sha"*)
                echo "An AI reviewer (Codex or Claude) reviewed the head commit ($sha)."
                exit 0
                ;;
            esac
          done
          marker="<!-- codex-gate:$HEAD_SHA -->"
          if gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' \
               | grep -qF "$marker"; then
            echo "Codex review already requested for $HEAD_SHA; waiting for it to land."
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" \
              -f body="$(printf '@codex review\n\n%s' "$marker")" >/dev/null
            echo "Requested a Codex review of $HEAD_SHA."
          fi
          echo "::error::Codex has not yet reviewed head commit $HEAD_SHA. The gate re-runs when its review is submitted."
          exit 1
