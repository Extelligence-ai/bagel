name: lint

on:
  workflow_call:
  workflow_dispatch:
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

# Same design as test.yaml's concurrency group (see its comment for the
# full rationale and doc citations): PR runs cancel a superseded push to
# the same PR (keyed by ref, which SHOULD cancel); every other trigger
# (workflow_call from publish.yaml, merge_group, workflow_dispatch) is
# keyed by github.sha so two overlapping releases' validate-lint calls can
# never collide and cancel each other.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: pyproject.toml
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: pyproject.toml
          args: format --check

  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: docker/Dockerfile*
          recursive: true

  types-and-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.0"
          python-version: "3.12"
      - run: uv sync --locked --group quality
      - run: uv run --no-sync mypy
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: '"$(go env GOPATH)/bin/actionlint" -color'
