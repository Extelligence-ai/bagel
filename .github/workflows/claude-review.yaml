# Claude as an AI reviewer: a maintainer comments "@claude review" on a PR
# and this workflow runs Claude Code against the PR diff, posts the findings
# as a PR review, and stamps it with the same "Reviewed commit: <sha>"
# marker the AI-review gate recognizes. Either reviewer (Codex or Claude)
# satisfies the gate; see codex-gate.yaml.
#
# KEYLESS: no ANTHROPIC_API_KEY anywhere. The job requests a GitHub OIDC
# token (audience https://api.anthropic.com) and the Anthropic SDK inside
# Claude Code exchanges it via Workload Identity Federation -- the console
# rule `bagel-claude-review` pins acceptance to THIS repo's default-branch
# runs (issue_comment jobs always run in default-branch context, so their
# sub claim is repo:Extelligence-ai/bagel:ref:refs/heads/main). GitHub JWTs
# live ~5 minutes and are single-use at exchange, so a background loop
# refreshes the token file for reviews that outlive one minted token.
#
# Requires four NON-SECRET repository variables (Settings -> Variables):
#   ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
#   ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID
# (identifiers only -- useless without a JWT GitHub will only sign for
# this repo's own workflow runs).
#
# Prompt-injection defense: the PR content Claude reads is untrusted, so its
# reads are path-scoped to the two checkouts (Read/Glob path specifiers) and
# its `gh` access is limited to read/review verbs only; the OIDC identity
# file lives under runner.temp -- outside any path Claude can read -- as
# defense-in-depth in case a scoping rule is bypassed.
name: claude-review
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - name: Point the identity token file outside the workspace
        # runner.temp, not /tmp: outside the workspace and outside any path
        # Claude's scoped Read/Glob rules can reach (see claude_args below).
        # The `runner` context isn't available in a job-level `env:` block,
        # so resolve it here (RUNNER_TEMP is always set for every step) and
        # export it via GITHUB_ENV for the rest of the job.
        run: echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/gha-jwt" >> "$GITHUB_ENV"
      - name: Resolve the PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          echo "head_sha=$(gh api repos/$REPO/pulls/$PR --jq .head.sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        # No `ref:` -> base branch at workspace root, per the action's own
        # security guidance: an untrusted PR head must never land at the
        # workspace root of a secret-bearing job. The PR head is checked out
        # into a subdirectory below and handed to Claude via --add-dir.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          path: pr-head
      - name: Keep a fresh OIDC token in the identity file
        run: |
          set -uo pipefail
          fetch() {
            local tmp
            # Create the temp file next to the target so the final mv is an
            # atomic same-filesystem rename.
            tmp="$(mktemp "${ANTHROPIC_IDENTITY_TOKEN_FILE}.XXXXXX")"
            if curl -sS -f -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
                | jq -er .value > "$tmp"; then
              mv "$tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
            else
              echo "::warning::OIDC token refresh failed; keeping last valid identity token" >&2
              rm -f "$tmp"
            fi
          }
          fetch
          # GitHub JWTs expire in ~5 min and each is single-use at exchange;
          # refresh the file so the SDK's re-exchange always finds a fresh one.
          # On a failed refresh, fetch() leaves the previous valid token file
          # untouched instead of clobbering it with an empty/null response.
          ( while true; do sleep 180; fetch; done ) &
      - name: Claude reviews the PR
        uses: anthropics/claude-code-action@v1
        with:
          prompt: >-
            Review pull request #${{ github.event.issue.number }} in this repository
            (head commit ${{ steps.pr.outputs.head_sha }}). Fetch the diff with
            `gh pr diff ${{ github.event.issue.number }}` and read any file you need
            under ./pr-head at the PR's head. Hunt for real defects: correctness,
            data loss, concurrency, security, contract breaks. Ignore style. Then
            submit ONE pull-request review via
            `gh pr review ${{ github.event.issue.number }} --comment --body "..."`
            whose body STARTS with the exact line:
            "Claude review -- Reviewed commit: ${{ steps.pr.outputs.head_sha }}"
            followed by your findings ranked by severity (or "No findings that
            block merge." if clean).
          # Read(path)/Glob(path) specifiers in --allowedTools are consulted
          # by Claude Code (docs.claude.com/en/docs/claude-code/permissions);
          # Grep(path) specifiers are only a "best-effort" match and are not
          # one of the documented enforced exceptions, so Grep is closed the
          # other way: a Read deny rule also gates Grep/Glob's target
          # directory, so --disallowedTools blocks the credential paths
          # outright regardless of which read tool is used.
          claude_args: >-
            --add-dir pr-head
            --allowedTools Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Read(./**),Grep(./**),Glob(./**)
            --disallowedTools Read(//tmp/**),Read(/${{ runner.temp }}/**)
            --max-turns 40
