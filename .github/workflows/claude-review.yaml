# Claude as an AI reviewer: a maintainer comments "@claude review" on a PR
# and this workflow runs Claude Code against the PR diff, posts the findings
# as a PR review, and stamps it with the same "Reviewed commit: <sha>"
# marker the AI-review gate recognizes. Either reviewer (Codex or Claude)
# satisfies the gate; see codex-gate.yaml.
#
# KEYLESS: no ANTHROPIC_API_KEY anywhere. The job requests a GitHub OIDC
# token (audience https://api.anthropic.com) and the Anthropic SDK inside
# Claude Code exchanges it via Workload Identity Federation -- the console
# rule `bagel-claude-review` pins acceptance to THIS repo's default-branch
# runs (issue_comment jobs always run in default-branch context, so their
# sub claim is repo:Extelligence-ai/bagel:ref:refs/heads/main). GitHub JWTs
# live ~5 minutes and are single-use at exchange, so a background loop
# refreshes the token file for reviews that outlive one minted token.
#
# Requires four NON-SECRET repository variables (Settings -> Variables):
#   ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
#   ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID
# (identifiers only -- useless without a JWT GitHub will only sign for
# this repo's own workflow runs).
#
# Prompt-injection defense: the PR content Claude reads is untrusted, so it
# gets NO posting capability at all -- every prior attempt to let the model
# post (raw `gh pr review`, then a narrowed wrapper script) still let an
# injected prompt control what got published and when, because the model's
# own Bash tool was the thing doing the posting (see PR #235 review
# discussion). Instead: Claude's `gh` access is read-only (`gh pr diff`,
# `gh pr view`), its Read/Grep/Glob reads are scoped to ./pr-head/**, and it
# writes its findings to ./claude-review-body.md via the Write tool -- that
# is the full extent of what it can do. A separate, deterministic shell step
# with no model in the loop then validates that the file exists and starts
# with the exact "Reviewed commit: <sha>" stamp for the real head commit,
# and only then posts it with `gh pr review`. A missing or malformed file
# means nothing gets posted and the job fails visibly. The OIDC identity
# file lives under runner.temp -- outside any path Claude can read -- as
# further defense-in-depth, though the model can no longer publish anything
# regardless of what it reads.
#
# Trade-off: the posting step runs as a plain shell step authenticated with
# GITHUB_TOKEN, not through claude-code-action's exchanged GitHub App token,
# so the review is authored by github-actions[bot], not claude[bot]. See the
# note in codex-gate.yaml.
name: claude-review
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - name: Point the identity token file outside the workspace
        # runner.temp, not /tmp: outside the workspace and outside any path
        # Claude's scoped Read/Glob rules can reach (see claude_args below).
        # The `runner` context isn't available in a job-level `env:` block,
        # so resolve it here (RUNNER_TEMP is always set for every step) and
        # export it via GITHUB_ENV for the rest of the job.
        run: echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/gha-jwt" >> "$GITHUB_ENV"
      - name: Resolve the PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          echo "head_sha=$(gh api repos/$REPO/pulls/$PR --jq .head.sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        # No `ref:` -> base branch at workspace root, per the action's own
        # security guidance: an untrusted PR head must never land at the
        # workspace root of a secret-bearing job. The PR head is checked out
        # into a subdirectory below and handed to Claude via --add-dir.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          path: pr-head
      - name: Keep a fresh OIDC token in the identity file
        run: |
          set -uo pipefail
          fetch() {
            local tmp
            # Create the temp file next to the target so the final mv is an
            # atomic same-filesystem rename.
            tmp="$(mktemp "${ANTHROPIC_IDENTITY_TOKEN_FILE}.XXXXXX")"
            if curl -sS -f -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
                | jq -er .value > "$tmp"; then
              mv "$tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
            else
              echo "::warning::OIDC token refresh failed; keeping last valid identity token" >&2
              rm -f "$tmp"
            fi
          }
          fetch
          # GitHub JWTs expire in ~5 min and each is single-use at exchange;
          # refresh the file so the SDK's re-exchange always finds a fresh one.
          # On a failed refresh, fetch() leaves the previous valid token file
          # untouched instead of clobbering it with an empty/null response.
          ( while true; do sleep 180; fetch; done ) &
      - name: Claude reviews the PR
        uses: anthropics/claude-code-action@v1
        with:
          prompt: >-
            Review pull request #${{ github.event.issue.number }} in this repository
            (head commit ${{ steps.pr.outputs.head_sha }}). Fetch the diff with
            `gh pr diff ${{ github.event.issue.number }}` and read any file you need
            ONLY under ./pr-head at the PR's head -- never read or search outside
            that directory. Hunt for real defects: correctness, data loss,
            concurrency, security, contract breaks. Ignore style. Then WRITE your
            findings to the file ./claude-review-body.md (create or overwrite it) --
            do not run `gh pr review`, do not run any other Bash command, and do not
            attempt to post or publish anything yourself. A separate, deterministic
            step (no model involved) reads that file and posts it as the PR review.
            The file's FIRST LINE must be exactly:
            "Claude review -- Reviewed commit: ${{ steps.pr.outputs.head_sha }}"
            followed by your findings ranked by severity (or "No findings that
            block merge." if clean).
          # Read(path)/Glob(path) specifiers in --allowedTools are consulted
          # by Claude Code (docs.claude.com/en/docs/claude-code/permissions);
          # Grep(path) specifiers are only a "best-effort" match and are not
          # one of the documented enforced exceptions, so Grep is closed the
          # other way: a Read deny rule also gates Grep/Glob's target
          # directory, so --disallowedTools blocks the credential paths
          # outright regardless of which read tool is used. There is no
          # posting tool of ANY kind in this allowlist -- no `gh pr review`,
          # no wrapper script -- because any tool that lets the model publish
          # something is exploitable by a prompt-injected PR: it controls
          # what gets posted and when. Claude can only write its findings to
          # a file; whether that file is ever published is entirely up to
          # the deterministic step below.
          claude_args: >-
            --add-dir pr-head
            --allowedTools Bash(gh pr diff:*),Bash(gh pr view:*),Read(./pr-head/**),Grep(./pr-head/**),Glob(./pr-head/**),Write(./claude-review-body.md)
            --disallowedTools Read(//tmp/**),Read(/${{ runner.temp }}/**)
            --max-turns 40
      - name: Post Claude's review (deterministic -- no model in this step)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          file=claude-review-body.md
          stamp="Claude review -- Reviewed commit: $HEAD_SHA"
          if [ ! -f "$file" ]; then
            echo "::error::$file was not produced by the review step; posting nothing."
            exit 1
          fi
          first_line="$(head -n 1 -- "$file")"
          if [ "$first_line" != "$stamp" ]; then
            echo "::error::$file's first line does not match the expected stamp for head commit $HEAD_SHA; posting nothing."
            echo "::error::expected: $stamp"
            echo "::error::got:      $first_line"
            exit 1
          fi
          gh pr review "$PR" --repo "$REPO" --comment --body-file "$file"
