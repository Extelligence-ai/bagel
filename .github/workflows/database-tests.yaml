name: database-tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: bagel-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.0"
          python-version: "3.12"
      - run: uv sync --locked --group iot
      - name: Start disposable InfluxDB
        run: >-
          docker run -d --name bagel-ci-influx -p 127.0.0.1:8181:8181
          influxdb:3-core influxdb3 serve --node-id ci --object-store memory --without-auth
      - name: Seed two independent events in each database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run --no-sync python scripts/seed_databases.py
      - name: Exercise real queries and previews without skips
        env:
          BAGEL_POSTGRES_TEST_URL: postgres://postgres:bagel-ci-test@localhost:5432/postgres
          BAGEL_INFLUXDB_TEST_URL: influxdb://localhost:8181/telemetry
          BAGEL_REQUIRE_NO_SKIPS: "1"
        run: uv run --no-sync pytest test/source/test_postgres.py test/source/test_influxdb.py --junitxml=junit-databases.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-databases
          path: junit-databases.xml
          if-no-files-found: error
      - name: Stop disposable InfluxDB
        if: always()
        run: |
          docker logs bagel-ci-influx
          docker rm -f bagel-ci-influx
