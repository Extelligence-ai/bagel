name: dependency-audit

on:
  workflow_call:
    inputs:
      base-ref:
        description: >-
          Git ref/SHA to diff dependency advisories against. Defaults to the
          pull_request/merge_group base, or the push's `before` SHA. A caller
          without any of those (e.g. a workflow_dispatch recovery run with no
          PR, merge-group, or push context) must pass this explicitly --
          otherwise the audit falls back to the commit under release, comparing
          it against itself, and a newly introduced advisory is never reported.
        required: false
        type: string
  pull_request:
  merge_group:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      base-ref:
        description: "Git ref/SHA to diff dependency advisories against (optional)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          path: audit-base
          sparse-checkout: |
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.0"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --group quality
      - name: Reject new advisories and incomplete audits
        run: uv run --no-sync python scripts/audit_dependencies.py --base audit-base
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-advisories
          path: audit-*.json
          if-no-files-found: error
