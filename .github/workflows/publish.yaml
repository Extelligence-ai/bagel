name: publish

on:
  push:
    branches:
      - main
  # Manual re-run for dropped push events (2026-08-19: GitHub silently skipped
  # all workflows for a merge commit; images for that version never built).
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group on this workflow: overlapping publish runs are left
# to run in parallel rather than serialized against each other.
#
# A `publish-main` group (cancel-in-progress: false) was tried first, but
# GitHub's documented default keeps at most one PENDING run per concurrency
# group: once a publish is running and a second push is pending, a third
# push cancels and replaces that still-pending run -- silently dropping the
# second commit's release, the same failure mode as the 2026-08-19
# dropped-event incident referenced above (that one lost the *push event*;
# this would lose the *queued run*; same end result -- a version whose
# images never publish). This holds regardless of cancel-in-progress, which
# only governs already-RUNNING jobs, not pending ones. Verified against
# GitHub's docs: https://docs.github.com/en/actions/using-jobs/using-concurrency
# -- "By default, any existing pending job or workflow in the same
# concurrency group will be canceled and the new queued job or workflow
# will take its place."
#
# GitHub Actions has since added `queue: max`, which keeps up to 100 pending
# runs and executes them one at a time in FIFO order -- exactly what this
# workflow needs, and it would additionally avoid two overlapping runs
# racing to tag the mutable `:latest` pointer. It is NOT used here because
# `queue` is unrecognized by actionlint as of the latest release (v1.7.12)
# and by the v1.7.7 pinned in this repo's types-and-workflows job --
# `actionlint .github/workflows/publish.yaml` fails with
# `unexpected key "queue" for "concurrency" section`. Revisit once
# actionlint's schema catches up.
#
# Given that constraint, no group beats a group with the `queue: single`
# default: every push's publish must eventually run, and dropping a queued
# release silently is worse than the risks of running in parallel. The
# remaining risks are bounded: per-version publication is protected by the
# `docker manifest inspect` immutability check already in the docker job
# (redundant concurrent pushes of the same not-yet-published version are
# idempotent, not corrupting), and a `:latest` pointer that a slower
# overlapping run leaves briefly behind the newest commit is self-healing --
# the next push to main republishes it forward again. Pushes to main are
# infrequent enough that this overlap is rare in practice.
jobs:
  # A `workflow_dispatch` recovery run (see the comment above) has no PR, merge
  # group, or push `before` SHA for dependency-audit.yaml to fall back on, so it
  # would otherwise diff the released commit against itself and silently accept
  # any newly introduced advisory. Resolve the parent commit here instead.
  resolve-audit-baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.parent.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
      - id: parent
        run: echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
  validate-tests:
    uses: ./.github/workflows/test.yaml
  validate-lint:
    uses: ./.github/workflows/lint.yaml
  validate-dependencies:
    needs: [resolve-audit-baseline]
    if: always() && !failure() && !cancelled()
    uses: ./.github/workflows/dependency-audit.yaml
    with:
      base-ref: ${{ needs.resolve-audit-baseline.outputs.sha }}
  docker:
    needs: [validate-tests, validate-lint, validate-dependencies]
    # always() opts out of the implicit success() check, which is false whenever any
    # upstream job was skipped: resolve-audit-baseline is skipped on every push, so
    # without it this job never ran (no images published 2026-09-04 .. 2.3.0).
    # !failure() and !cancelled() still require validation to pass.
    if: always() && !failure() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ROS (ros2-kilted excluded: it publishes via the dedicated
          # kilted-amd64 / publish-arm64 / merge-manifests jobs below, which
          # produce its multi-arch manifest -- see those jobs' comments).
          - service: ros2-jazzy
          - service: ros2-jazzy-jev
          - service: ros2-iron
          - service: ros2-humble
          - service: ros1-noetic
          - service: ros1-noetic-cv
          # Drones
          - service: px4
          - service: ardupilot
          - service: betaflight
          # Non-ROS services: the compose image name differs from the service
          # name for apache-arrow (image path "arrow").
          - service: apache-arrow
            image: arrow
          - service: iot
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/lib/jvm
      - name: Build ${{ matrix.service }}
        run: docker compose build ${{ matrix.service }}
      - name: Push ${{ matrix.service }}
        run: |
          IMAGE=ghcr.io/extelligence-ai/bagel/${{ matrix.image || matrix.service }}
          TAG=sha-${{ github.sha }}
          # Semver tag from pyproject: the MCP registry rejects "latest", so
          # server.json pins this tag (see server.json at the repo root).
          # Never overwrite an existing semver tag: this workflow runs on every
          # push to main, and the registry entry treats the tag as immutable.
          # Bump the pyproject version to publish a new one.
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          docker tag "$IMAGE:latest" "$IMAGE:$TAG"
          # ghcr intermittently drops a blob mid-push ("unknown blob"); a
          # short-backoff retry has cleared it on every occurrence to date
          # (2.1.0, 2.1.1, 2.2.0 all needed manual reruns for this).
          push_with_retry() {
            for attempt in 1 2 3; do
              docker push "$1" && return 0
              echo "push $1 failed (attempt $attempt); retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            done
            docker push "$1"
          }
          push_with_retry "$IMAGE:latest"
          push_with_retry "$IMAGE:$TAG"
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already published; leaving it untouched"
          else
            docker tag "$IMAGE:latest" "$IMAGE:$VERSION"
            push_with_retry "$IMAGE:$VERSION"
          fi

  # ros2-kilted is the image server.json pins and the one most users pull, so
  # it is built for both architectures. Originally PR #215, which merged into
  # beta/fleet-streaming rather than main and so never shipped -- every
  # published image through 2.4.0 is amd64-only, and Apple Silicon runs Bagel
  # under emulation.
  #
  # amd64 leg. Isolated from the `docker` matrix entirely (Codex review on
  # #215) so that (a) no single-arch latest/$VERSION/sha tag is ever visible to
  # users -- only merge-manifests below writes those -- and (b) the merge does
  # not depend on the other services' matrix legs succeeding. This job pushes
  # ONLY a run-scoped staging tag, so concurrent main pushes each get their own
  # staging references and cannot clobber each other.
  kilted-amd64:
    needs: [validate-tests, validate-lint, validate-dependencies]
    if: always() && !failure() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/lib/jvm
      - name: Build ros2-kilted
        run: docker compose build ros2-kilted
      - name: Push ros2-kilted staging tag (amd64)
        run: |
          IMAGE=ghcr.io/extelligence-ai/bagel/ros2-kilted
          # Same ghcr blob-drop retry as the `docker` job's push step.
          push_with_retry() {
            for attempt in 1 2 3; do
              docker push "$1" && return 0
              echo "push $1 failed (attempt $attempt); retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            done
            docker push "$1"
          }
          docker tag "$IMAGE:latest" "$IMAGE:staging-${{ github.run_id }}-amd64"
          push_with_retry "$IMAGE:staging-${{ github.run_id }}-amd64"

  # arm64 leg. GitHub-hosted native arm64 runner (free for public repos), so
  # `docker compose build` targets arm64 without cross compilation -- compose
  # has no `platforms:` override, so it builds for the runner's own arch by
  # default. Same staging-only rule as kilted-amd64: no final tag is ever
  # pushed from this job.
  publish-arm64:
    needs: [validate-tests, validate-lint, validate-dependencies]
    if: always() && !failure() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/lib/jvm
      - name: Build ros2-kilted
        run: docker compose build ros2-kilted
      - name: Push ros2-kilted staging tag (arm64)
        run: |
          IMAGE=ghcr.io/extelligence-ai/bagel/ros2-kilted
          # Same ghcr blob-drop retry as the `docker` job's push step.
          push_with_retry() {
            for attempt in 1 2 3; do
              docker push "$1" && return 0
              echo "push $1 failed (attempt $attempt); retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            done
            docker push "$1"
          }
          docker tag "$IMAGE:latest" "$IMAGE:staging-${{ github.run_id }}-arm64"
          push_with_retry "$IMAGE:staging-${{ github.run_id }}-arm64"

  # The ONLY place ros2-kilted's final, user-facing tags are created. Needs
  # just the two staging producers -- not the `docker` matrix -- so an
  # unrelated service's build failure can never block or skip it (Codex review
  # on #215). Replicates the `docker` job's tagging rules exactly: latest and
  # sha-<sha> unconditionally, plus $VERSION gated by the same immutability
  # check -- evaluated here, at the only point the final $VERSION tag is
  # actually created, so a version bump can never observe a semver tag that a
  # single-arch push already claimed.
  merge-manifests:
    needs: [kilted-amd64, publish-arm64]
    if: always() && !failure() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ros2-kilted manifest (amd64 + arm64)
        run: |
          IMAGE=ghcr.io/extelligence-ai/bagel/ros2-kilted
          STAGING_AMD64="$IMAGE:staging-${{ github.run_id }}-amd64"
          STAGING_ARM64="$IMAGE:staging-${{ github.run_id }}-arm64"
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          docker buildx imagetools create -t "$IMAGE:latest" "$STAGING_AMD64" "$STAGING_ARM64"
          docker buildx imagetools create \
            -t "$IMAGE:sha-${{ github.sha }}" "$STAGING_AMD64" "$STAGING_ARM64"
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already published; leaving it untouched"
          else
            docker buildx imagetools create -t "$IMAGE:$VERSION" "$STAGING_AMD64" "$STAGING_ARM64"
          fi
      # Best-effort cleanup is deliberately omitted: staging-<run_id>-{amd64,
      # arm64} are never used again after the merge, but deleting them needs
      # the ghcr package-version API (look up the version id for a tag, then
      # DELETE it) rather than a docker one-liner. They accumulate harmlessly
      # -- one pair per run, pulled by nothing, cheap to prune in bulk later.
