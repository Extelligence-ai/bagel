  # Local LLM for a fully offline stack: your data AND your model never leave
  # the machine. Opt-in via `docker compose --profile local-llm up ollama`.
  # See doc/runbooks/local_llm.md for the full walkthrough.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      # Bound to localhost: like the MCP endpoint, the ollama LLM endpoint
      # is unauthenticated. Publishing to 0.0.0.0 would expose it to the LAN.
      # To share it deliberately, drop the 127.0.0.1 prefix and put an
      # authenticated proxy in front (#158).
      - "127.0.0.1:11434:11434"
    volumes:
      # Models are multi-GB; persist them across container restarts.
      - ${HOME}/.ollama:/root/.ollama
