services:
  ros2-kilted:
    image: ghcr.io/extelligence-ai/bagel/ros2-kilted:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.ros2
      args:
        ROS_DISTRO: kilted
        UV_VERSION: 0.8.0
        DEV_MODE: false
        MCP_SERVER_PORT: ${MCP_SERVER_PORT}
        JUPYTER_HOST: ${JUPYTER_HOST}
        JUPYTER_PORT: ${JUPYTER_PORT}
    environment:
      CONTAINER_MODE: true
      MCP_SERVER_PORT: ${MCP_SERVER_PORT}
    ports:
      # Bound to localhost: the MCP endpoint is unauthenticated by design
      # (SECURITY.md). Publishing to 0.0.0.0 would expose it to the LAN and
      # bypass host firewalls. To share it deliberately, drop the 127.0.0.1
      # prefix and put an authenticated proxy in front (#158).
      - "127.0.0.1:${MCP_SERVER_PORT}:${MCP_SERVER_PORT}"
      - "127.0.0.1:${JUPYTER_PORT}:${JUPYTER_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Artifacts (reduced bags, snippets, exports) land on the host, so desktop
      # tools like PlotJuggler can open them directly. On Linux, run
      # `mkdir -p ~/.bagel/artifacts` once so the directory is owned by you.
      - ${HOME}/.bagel/artifacts:/home/ubuntu/.bagel/artifacts
      # - <path-to-local-data>:/home/ubuntu/data

